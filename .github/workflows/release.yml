name: Instaladores

# ADR 017: los instaladores se generan aquí, no en el equipo de cada persona. Una etiqueta
# vX.Y.Z publica una versión; «Run workflow» los genera solo como artefactos para probarlos.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installers:
    name: Instaladores (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Windows-x64
            bundles: msi,nsis
          # La versión más antigua de Ubuntu disponible: el AppImage y el motor empaquetado
          # funcionan en distribuciones con una glibc igual o más nueva.
          - os: ubuntu-22.04
            artifact: Linux-x64
            bundles: deb,rpm,appimage
          - os: ubuntu-22.04-arm
            artifact: Linux-arm64
            bundles: deb,rpm,appimage
          # Apple silicon (M1 y posteriores) e Intel. Sin firma ni notarización (ADR 029).
          - os: macos-latest
            artifact: macOS-arm64
            bundles: dmg
          - os: macos-15-intel
            artifact: macOS-x64
            bundles: dmg
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - name: Instalar Python y dependencias
        working-directory: engine
        run: uv sync --locked

      - uses: actions/cache@v4
        with:
          path: engine/models
          key: embedding-model-${{ hashFiles('engine/argus/infrastructure/nlp/embedding_model.py') }}

      - name: Modelo de embeddings
        working-directory: engine
        run: uv run python -m argus.infrastructure.nlp.embedding_model

      - name: Empaquetar el motor
        working-directory: engine
        run: uv run pyinstaller distribution/argus-engine.spec --noconfirm --distpath dist --workpath build/pyinstaller

      # OCR local (ADR 027): Tesseract viaja dentro de los instaladores con español e inglés.
      # En Windows se toma la compilación de UB Mannheim (Chocolatey); en Linux, la de Ubuntu,
      # con sus bibliotecas. Los idiomas se descargan verificados por SHA-256.
      - name: Instalar Tesseract (Windows)
        if: runner.os == 'Windows'
        run: choco install tesseract --no-progress -y

      - name: Instalar Tesseract (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Instalar Tesseract (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract

      - name: Incluir Tesseract
        working-directory: engine
        run: uv run python distribution/bundle_tesseract.py

      # Un instalador con un motor que no arranca, sin internet, o que no lee escaneados no se
      # publica.
      - name: Probar el motor empaquetado
        working-directory: engine
        run: uv run python distribution/smoke_test.py

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias de la interfaz
        working-directory: app
        run: npm ci

      - name: Dependencias del sistema para Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      # tauri.bundle.conf.json añade el motor, los modelos y Tesseract como recursos.
      - name: Generar instaladores
        working-directory: app
        run: npm run tauri -- build --config src-tauri/tauri.bundle.conf.json --bundles ${{ matrix.bundles }}

      # Windows también sale como zip portable: el ejecutable con el motor, los modelos y Tesseract
      # al lado (en Windows los recursos se buscan junto al .exe).
      - name: Zip portable (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          stage="portable/ARGUS"
          mkdir -p "$stage"
          cp app/src-tauri/target/release/argus.exe "$stage/"
          cp -r engine/dist/argus-engine "$stage/engine"
          cp -r engine/models "$stage/models"
          cp -r engine/dist/tesseract "$stage/tesseract"
          mkdir -p out
          powershell -NoProfile -Command "Compress-Archive -Path portable/ARGUS -DestinationPath out/ARGUS_${version}_x64_portable.zip"

      - name: Reunir instaladores
        shell: bash
        run: |
          mkdir -p out
          find app/src-tauri/target/release/bundle -type f \
            \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.rpm' \
               -o -name '*.AppImage' -o -name '*.dmg' \) -exec cp {} out/ \;
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: argus-${{ matrix.artifact }}
          if-no-files-found: error
          path: out/*

  release:
    name: Publicar versión
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Sumas SHA-256
        working-directory: installers
        run: sha256sum * | tee SHA256SUMS.txt

      # Instaladores sin firma de código por ahora (ADR 017 y 029): Windows mostrará SmartScreen
      # y macOS pedirá abrir la app desde Ajustes › Privacidad y seguridad.
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true

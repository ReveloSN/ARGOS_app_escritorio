name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    name: Motor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - name: Instalar Python y dependencias
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Formato
        run: uv run black --check .

      - name: Tipos
        run: uv run mypy

      - name: Pruebas
        run: uv run pytest

  app:
    name: Interfaz (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Tipos
        run: npm run typecheck

      - name: Pruebas
        run: npm test

      # tauri::generate_context! exige que dist/ exista al compilar Rust (clippy incluido).
      - name: Compilar interfaz
        run: npm run build

      - name: Dependencias del sistema para Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Formato Rust
        working-directory: app/src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: app/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Compila la app completa sin generar instaladores; el empaquetado es de la Fase 8.
      - name: Compilar app de escritorio
        run: npm run tauri -- build --no-bundle

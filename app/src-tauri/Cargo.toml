[package]
name = "argus"
version = "0.1.0"
description = "ARGUS: detecta inconsistencias entre documentos antes de enviarlos o firmarlos."
authors = ["nicolas Revelo"]
repository = "https://github.com/ReveloSN/ARGOS_app_escritorio"
edition = "2024"
rust-version = "1.90"

[lib]
name = "argus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4" }
tauri-plugin-log = "2"

[project]
name = "argus-engine"
version = "0.1.0"
description = "Motor local de análisis de ARGUS: lee documentos, extrae entidades y detecta inconsistencias."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.1",
    "openpyxl>=3.1.5",
    "pypdf>=6.20.1",
    "python-docx>=1.2.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argus"]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "types-openpyxl>=3.1.5.20260827",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "C90", "PL", "RUF", "ANN", "PT", "TID"]
# E501 lo cubre black; ANN401 se revisa caso a caso con mypy strict.
ignore = ["E501"]
# PLR1702 (anidación máxima) solo existe en preview; se activa de forma explícita.
preview = true
explicit-preview-rules = true
extend-select = ["PLR1702"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.pylint]
# CLAUDE.md §4: máximo 3 parámetros; con más, usar un objeto de parámetros.
max-args = 3
max-nested-blocks = 2

[tool.ruff.lint.flake8-tidy-imports]
# Imports absolutos: la prueba de capas (tests/architecture) solo así ve cada dependencia.
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["argus", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=argus --cov-report=term-missing"
filterwarnings = ["error"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
